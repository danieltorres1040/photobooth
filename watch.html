<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Your Photo Strip</title>
<link rel="icon" href="icon.png">
<style>
  @font-face{font-family:Inter;font-weight:400;src:url(fonts/Inter-Regular.woff) format('woff')}
  @font-face{font-family:Inter;font-weight:500;src:url(fonts/Inter-Medium.woff) format('woff')}
  @font-face{font-family:Inter;font-weight:600;src:url(fonts/Inter-SemiBold.woff) format('woff')}
  @font-face{font-family:Inter;font-weight:700;src:url(fonts/Inter-Bold.woff) format('woff')}
  :root{--mag:#FD65A5;--cyan:#00AEEF;--yel:#F9EE06;--card:#F4F7EE}
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:#000;font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
  body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:20px;
    padding:max(24px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
  .bar{display:flex;width:min(300px,80vw);height:6px}
  .bar i{flex:1} .bar i:nth-child(1){background:#E73D7D} .bar i:nth-child(2){background:#4DABE9} .bar i:nth-child(3){background:#FDFF64}
  .bar i:nth-child(4){background:#000} .bar i:nth-child(5){background:#E73D7D}
  h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-0.01em;text-transform:uppercase;text-align:center}
  .media{height:min(50dvh,560px);aspect-ratio:1/3;background:#e9e9e9;box-shadow:0 12px 30px rgba(0,0,0,.18);position:relative}
  .media video,.media img{width:100%;height:100%;display:block;object-fit:cover}
  .btn{font:inherit;font-size:18px;font-weight:600;background:#000;color:#fff;border:0;width:min(300px,86vw);height:56px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;text-decoration:none}
  .btn:disabled{background:#8c8c8c}
  .card{background:var(--card);border-radius:11px;padding:16px 18px;width:min(300px,86vw)}
  ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  li{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.01em}
  li b{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff}
  li:nth-child(1) b{background:var(--mag)} li:nth-child(2) b{background:var(--cyan)} li:nth-child(3) b{background:var(--yel);color:#000}
  .note{font-size:13px;color:#777;text-align:center;max-width:300px;line-height:1.4}
  .err{color:#b00}
</style>
</head>
<body>
  <div class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <h1>Your photo strip</h1>
  <div class="media" id="media"></div>
  <button class="btn" id="save" disabled>getting your strip…</button>
  <div class="card">
    <ol id="steps">
      <li><b>01</b>Tap the button above</li>
      <li><b>02</b><span id="step2">Choose “Save Video”</span></li>
      <li><b>03</b>Find it in your photos ♡</li>
    </ol>
  </div>
  <p class="note" id="note">Fall 26 Senior Show · To Be Continued</p>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const cloud = (q.get('c') || 'f6qum3qh').replace(/[^\w-]/g, ''), id = (q.get('id') || '').replace(/[^\w\-\/]/g, '');
  const isVideo = q.get('t') !== 'i';
  const base = `https://res.cloudinary.com/${cloud}/${isVideo ? 'video' : 'image'}/upload`;
  const url = `${base}/${id}.${isVideo ? 'mp4' : 'jpg'}`;
  const dlURL = `${base}/fl_attachment/${id}.${isVideo ? 'mp4' : 'jpg'}`;
  if (!id) { $('save').textContent = 'link is missing its photo'; return; }

  const media = $('media');
  if (isVideo) {
    const v = document.createElement('video');
    Object.assign(v, { src: url, muted: true, loop: true, autoplay: true, playsInline: true });
    v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
    media.appendChild(v); v.play().catch(() => {});
  } else {
    $('step2').textContent = 'Choose “Save Image”';
    const im = document.createElement('img'); im.src = url; im.alt = 'your photo strip'; media.appendChild(im);
  }

  // download it now, so the tap can open the share sheet straight away (“Save Video” puts it in Photos)
  let file = null;
  const name = 'photo-strip.' + (isVideo ? 'mp4' : 'jpg'), type = isVideo ? 'video/mp4' : 'image/jpeg';
  fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); }).then(b => {
    file = new File([b], name, { type });
    const canShare = navigator.canShare && navigator.canShare({ files: [file] });
    $('save').disabled = false;
    $('save').textContent = canShare ? 'save to photos' : 'download';
    if (!canShare) $('step2').textContent = 'Open the download and save it';
  }).catch(() => {
    // couldn't fetch it (old browser or blocked): fall back to a plain download link
    const a = document.createElement('a'); a.className = 'btn'; a.href = dlURL; a.textContent = 'download'; a.setAttribute('download', name);
    $('save').replaceWith(a);
    $('step2').textContent = 'Open the download, tap share, then “Save Video”';
  });
  $('save').addEventListener('click', async () => {
    if (!file) return;
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); } catch (e) {}
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    }
  });
})();
</script>
</body>
</html>
